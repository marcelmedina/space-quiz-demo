<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Space Exploration Quiz</title>
<style>
  :root {
    --bg: #f4f5fb;
    --bg-accent: #e6e8f7;
    --card: #ffffff;
    --text: #1c1f33;
    --muted: #62667f;
    --border: #dfe2f0;
    --primary: #5b5bf0;
    --primary-2: #a855f7;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
    --shadow: 0 10px 30px rgba(30, 35, 90, .10);
    --panel: #eef0fa;
    --scanline: rgba(30, 35, 90, .035);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d1a;
      --bg-accent: #161a33;
      --card: #151831;
      --text: #e8eaf8;
      --muted: #9ba0c0;
      --border: #272b4d;
      --primary: #818cf8;
      --primary-2: #c084fc;
      --correct: #4ade80;
      --correct-bg: rgba(74, 222, 128, .14);
      --wrong: #f87171;
      --wrong-bg: rgba(248, 113, 113, .14);
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
      --panel: #0d1024;
      --scanline: rgba(255, 255, 255, .025);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg-accent), var(--bg) 60%) fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 440px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .meta {
    position: relative; overflow: hidden;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 8px 12px; margin-bottom: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), inset 0 0 0 1px rgba(0, 0, 0, .02);
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    color: var(--muted);
  }
  .meta::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 2px, var(--scanline) 2px 3px);
  }
  .readout { display: flex; align-items: center; gap: 8px; }
  .readout .label {
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  }
  .readout .value {
    font-size: 15px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .readout .value b { color: var(--primary); font-weight: 700; }
  .led {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--led, var(--correct));
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--led, var(--correct)) 25%, transparent),
                0 0 8px var(--led, var(--correct));
    animation: blink 1.6s ease-in-out infinite;
  }
  .meta[data-status="wrong"] { --led: var(--wrong); }
  .meta[data-status="correct"] { --led: var(--correct); }
  .score { display: inline-block; }
  .score.bump { animation: bump .4s ease; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .progress {
    height: 8px; background: var(--bg-accent); border-radius: 999px;
    overflow: hidden; margin-bottom: 20px;
  }
  .progress > div {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    border-radius: inherit;
    transition: width .45s cubic-bezier(.4, 0, .2, 1);
  }
  .question { font-size: 17px; font-weight: 600; margin: 0 0 16px; }
  .options { display: grid; gap: 10px; }
  .option {
    font: inherit; font-size: 15px; color: var(--text);
    text-align: left; cursor: pointer;
    padding: 12px 14px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    transition: border-color .15s, background .15s, transform .1s;
    display: flex; align-items: center; gap: 10px;
  }
  .option .key {
    flex: none; width: 24px; height: 24px; border-radius: 7px;
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
    background: var(--bg-accent); color: var(--muted);
  }
  .option:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-1px); }
  .option:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .option.correct {
    border-color: var(--correct); background: var(--correct-bg);
    animation: pop .45s ease;
  }
  .option.correct .key { background: var(--correct); color: #fff; }
  .option.wrong {
    border-color: var(--wrong); background: var(--wrong-bg);
    animation: shake .45s ease;
  }
  .option.wrong .key { background: var(--wrong); color: #fff; }
  .option.dim { opacity: .5; }
  .feedback {
    min-height: 24px; margin-top: 14px; font-size: 14px; font-weight: 500;
  }
  .feedback, .fact {
    opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s;
  }
  .feedback.show, .fact.show { opacity: 1; transform: none; }
  .feedback.good { color: var(--correct); }
  .feedback.bad { color: var(--wrong); }
  .fact { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .btn {
    font: inherit; font-size: 15px; font-weight: 600;
    width: 100%; margin-top: 14px; padding: 12px;
    border: 0; border-radius: 12px; cursor: pointer; color: #fff;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.98); }
  .btn[hidden] { display: none; }
  .results { text-align: center; }
  .results .emoji { font-size: 64px; line-height: 1; display: inline-block; animation: float 2.4s ease-in-out infinite, enter .6s cubic-bezier(.2, 1.4, .4, 1); }
  .results h2 { margin: 12px 0 4px; font-size: 20px; }
  .results .big { font-size: 34px; font-weight: 700; margin: 8px 0 2px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .results p { color: var(--muted); margin: 0; }
  .fade-in { animation: fadeIn .35s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }
  @keyframes bump { 50% { transform: scale(1.2); } }
  @keyframes blink { 50% { opacity: .45; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes enter { from { transform: scale(.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>🚀 Space Exploration Quiz</h1>
    <p>10 questions about missions, planets and the people who went there.</p>
  </header>
  <section class="card" id="card" aria-live="polite"></section>
</main>

<script>
const QUESTIONS = [
  { q: "Who was the first human to travel into space?", a: ["Neil Armstrong", "Yuri Gagarin", "Alan Shepard", "John Glenn"], c: 1, fact: "Gagarin's Vostok 1 flight completed one orbit of Earth in 108 minutes." },
  { q: "Which mission first landed humans on the Moon?", a: ["Apollo 8", "Apollo 11", "Apollo 13", "Gemini 4"], c: 1, fact: "While Neil Armstrong and Buzz Aldrin explored the Moon, Michael Collins stayed in orbit aboard the command module." },
  { q: "What was the name of the first artificial satellite?", a: ["Explorer 1", "Vostok 1", "Sputnik 1", "Telstar"], c: 2, fact: "Sputnik 1 circled Earth about once every 96 minutes and sent radio signals for roughly three weeks." },
  { q: "Which planet has the tallest known volcano, Olympus Mons?", a: ["Venus", "Mars", "Jupiter", "Mercury"], c: 1, fact: "Olympus Mons is about 22 kilometres high and roughly 600 kilometres across." },
  { q: "Which spacecraft became the first to enter interstellar space?", a: ["Voyager 1", "Pioneer 10", "New Horizons", "Cassini"], c: 0, fact: "Voyager 1 crossed the heliopause into interstellar space in 2012, more than 35 years after launch." },
  { q: "Which NASA rover landed in Jezero Crater in 2021?", a: ["Curiosity", "Opportunity", "Spirit", "Perseverance"], c: 3, fact: "Perseverance carried Ingenuity, which made the first powered, controlled flight on another planet in 2021." },
  { q: "Which telescope launched in 2021 observes mainly in infrared?", a: ["Hubble", "James Webb", "Spitzer", "Kepler"], c: 1, fact: "The James Webb Space Telescope orbits the Sun near the Sun-Earth L2 point, about 1.5 million kilometres from Earth." },
  { q: "Who was the first woman to fly in space?", a: ["Sally Ride", "Valentina Tereshkova", "Mae Jemison", "Eileen Collins"], c: 1, fact: "Tereshkova completed 48 orbits of Earth during her 1963 Vostok 6 mission." },
  { q: "Roughly how long does sunlight take to reach Earth?", a: ["8 seconds", "8 minutes", "8 hours", "8 days"], c: 1, fact: "Because Earth's orbit is slightly elliptical, the travel time varies; on average, sunlight takes about 8 minutes and 20 seconds to arrive." },
  { q: "Which mission flew past Pluto in 2015?", a: ["Juno", "Dawn", "New Horizons", "Rosetta"], c: 2, fact: "New Horizons made the first close flyby of Pluto on July 14, 2015, revealing a surprisingly varied icy world." },
];

const card = document.getElementById("card");
let index = 0, score = 0;
const pad = n => String(n).padStart(2, "0");

function render() {
  const item = QUESTIONS[index];
  card.innerHTML = `
    <div class="meta" id="meta" role="group" aria-label="Mission status">
      <div class="readout">
        <span class="led" aria-hidden="true"></span>
        <span class="label" aria-hidden="true">Mission</span>
        <span class="value" aria-hidden="true">Q<b>${pad(index + 1)}</b>/${pad(QUESTIONS.length)}</span>
        <span class="sr-only">Question ${index + 1} of ${QUESTIONS.length}</span>
      </div>
      <div class="readout">
        <span class="label" aria-hidden="true">Score</span>
        <span class="value score" id="score" aria-hidden="true">${pad(score)}</span>
        <span class="sr-only" id="score-sr">Score: ${score}</span>
      </div>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${index}"><div id="bar"></div></div>
    <div class="fade-in">
      <p class="question">${item.q}</p>
      <div class="options">
        ${item.a.map((t, i) => `<button class="option" data-i="${i}"><span class="key">${"ABCD"[i]}</span><span>${t}</span></button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      ${item.fact ? '<p class="fact" id="fact" hidden></p>' : ""}
      <button class="btn" id="next" hidden>${index === QUESTIONS.length - 1 ? "See results" : "Next question →"}</button>
    </div>`;
  const bar = document.getElementById("bar");
  bar.style.width = (index / QUESTIONS.length * 100) + "%";
  card.querySelectorAll(".option").forEach(b => b.addEventListener("click", () => choose(+b.dataset.i)));
  document.getElementById("next").addEventListener("click", next);
}

function choose(i) {
  const item = QUESTIONS[index];
  const buttons = [...card.querySelectorAll(".option")];
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById("feedback");
  if (i === item.c) {
    score++;
    buttons[i].classList.add("correct");
    fb.textContent = "✅ Correct! Nice work, astronaut.";
    fb.className = "feedback good";
    const s = document.getElementById("score");
    s.textContent = pad(score);
    s.classList.add("bump");
    document.getElementById("score-sr").textContent = `Score: ${score}`;
  } else {
    buttons[i].classList.add("wrong");
    buttons[item.c].classList.add("correct");
    fb.textContent = `❌ Not quite — it's ${item.a[item.c]}.`;
    fb.className = "feedback bad";
  }
  buttons.forEach((b, j) => { if (j !== i && j !== item.c) b.classList.add("dim"); });
  document.getElementById("meta").dataset.status = i === item.c ? "correct" : "wrong";
  const fact = item.fact ? document.getElementById("fact") : null;
  if (fact) {
    fact.textContent = item.fact;
    fact.hidden = false;
  }
  requestAnimationFrame(() => {
    fb.classList.add("show");
    if (fact) fact.classList.add("show");
  });
  const bar = document.getElementById("bar");
  bar.style.width = ((index + 1) / QUESTIONS.length * 100) + "%";
  bar.parentElement.setAttribute("aria-valuenow", index + 1);
  const nextBtn = document.getElementById("next");
  nextBtn.hidden = false;
  nextBtn.focus({ preventScroll: true });
}

function next() {
  index++;
  index < QUESTIONS.length ? render() : results();
}

function results() {
  const pct = score / QUESTIONS.length;
  const [emoji, title, msg] =
    pct === 1   ? ["🤩", "Mission Commander!", "A perfect score — you're ready for launch."] :
    pct >= .8   ? ["🚀", "Ace Astronaut!", "Outstanding knowledge of the cosmos."] :
    pct >= .6   ? ["🛰️", "Solid Orbit", "Good job — a few more missions and you'll be a pro."] :
    pct >= .4   ? ["🌍", "Still Grounded", "Not bad! Keep looking up."] :
                  ["😵‍💫", "Lost in Space", "Time to brush up on your space history."];
  card.innerHTML = `
    <div class="results fade-in">
      <div class="emoji" aria-hidden="true">${emoji}</div>
      <h2>${title}</h2>
      <div class="big">${score} / ${QUESTIONS.length}</div>
      <p>${msg}</p>
      <button class="btn" id="restart">Play again</button>
    </div>`;
  document.getElementById("restart").addEventListener("click", () => { index = 0; score = 0; render(); });
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const k = e.key.toUpperCase();
  const i = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(k);
  const opts = card.querySelectorAll(".option");
  if (i >= 0 && opts[i] && !opts[i].disabled) opts[i].click();
});

render();
</script>
</body>
</html>
